server {
    listen 80;
    client_max_body_size 3m;

    location /error-annotation/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /error-annotation/uploads/ {
        proxy_pass http://backend:8000/error-annotation/uploads/;
        proxy_set_header Host $host;
    }

    location /error-annotation/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /error-annotation/index.html;
    }

    location = / {
        return 301 /error-annotation/;
    }
}
